<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Account Lookup</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <a href="/admin" class="settings-link" aria-label="Admin Settings" title="Admin Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
  </a>

  <div class="page-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <div class="logo-icon">⚡</div>
        <div>
          <h1>Student Account Lookup</h1>
          <p class="subtitle">Authorized Credential Verification</p>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">
      <!-- Input Card: Exactly One Student-Number Input & One Submit Button -->
      <section class="card input-card">
        <form id="student-lookup-form" class="diagnostics-form" autocomplete="off">
          <div class="form-row">
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input
                type="text"
                id="student-number-input"
                name="studentNumber"
                placeholder="Enter Student Number"
                required
                autofocus
              />
            </div>
            <button type="submit" id="submit-btn" class="submit-btn">
              <span class="btn-text">Submit</span>
              <span class="btn-spinner" hidden></span>
            </button>
          </div>
          <div id="validation-error" class="validation-error" hidden></div>
        </form>
      </section>

      <!-- Loading State Card -->
      <section id="loading-card" class="card status-card loading-card" hidden>
        <div class="spinner"></div>
        <p>Processing lookup...</p>
      </section>

      <!-- Error State Card -->
      <section id="error-card" class="card status-card error-card" hidden>
        <div class="error-badge">⚠️</div>
        <div class="error-content">
          <p id="error-message"></p>
        </div>
      </section>

      <!-- Final Output Card: Exactly Username and Hash Result Only -->
      <section id="results-card" class="card results-card" hidden>
        <div class="result-display-grid">
          <div class="result-row">
            <span class="result-label">Username:</span>
            <span id="output-username" class="result-value font-mono">-</span>
          </div>
          <div class="result-row">
            <span class="result-label" data-field="Password:">Hash:</span>
            <div class="hash-container">
              <span id="output-password" class="result-value font-mono">-</span>
              <button
                type="button"
                id="copy-hash-btn"
                class="copy-hash-btn"
                aria-label="Copy hash"
                title="Copy hash"
                hidden
              >
                <svg class="copy-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span id="copy-feedback" class="copy-feedback" aria-live="polite"></span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Authorized Support Environment</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
