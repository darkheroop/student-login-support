<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Account Lookup</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="page-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <div class="logo-icon">⚡</div>
        <div>
          <h1>Student Account Lookup</h1>
          <p class="subtitle">Authorized Credential Verification</p>
        </div>
      </div>
      <div>
        <a href="/admin" style="font-size: 0.8125rem; color: var(--text-secondary); text-decoration: none; padding: 0.4rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); transition: all 0.2s;" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">Admin Console ↗</a>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">
      <!-- Input Card: Exactly One Student-Number Input & One Submit Button -->
      <section class="card input-card">
        <form id="student-lookup-form" class="diagnostics-form" autocomplete="off">
          <div class="form-row">
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input
                type="text"
                id="student-number-input"
                name="studentNumber"
                placeholder="Enter Student Number"
                required
                autofocus
              />
            </div>
            <button type="submit" id="submit-btn" class="submit-btn">
              <span class="btn-text">Submit</span>
              <span class="btn-spinner" hidden></span>
            </button>
          </div>
          <div id="validation-error" class="validation-error" hidden></div>
        </form>
      </section>

      <!-- Loading State Card -->
      <section id="loading-card" class="card status-card loading-card" hidden>
        <div class="spinner"></div>
        <p>Processing lookup...</p>
      </section>

      <!-- Error State Card -->
      <section id="error-card" class="card status-card error-card" hidden>
        <div class="error-badge">⚠️</div>
        <div class="error-content">
          <p id="error-message"></p>
        </div>
      </section>

      <!-- Final Output Card: Exactly Username and Password Result Only -->
      <section id="results-card" class="card results-card" hidden>
        <div class="result-display-grid">
          <div class="result-row">
            <span class="result-label">Username:</span>
            <span id="output-username" class="result-value font-mono">-</span>
          </div>
          <div class="result-row">
            <span class="result-label">Password:</span>
            <span id="output-password" class="result-value font-mono">-</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Authorized Support Environment</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
